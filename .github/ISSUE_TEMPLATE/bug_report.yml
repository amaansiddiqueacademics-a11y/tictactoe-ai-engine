name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - On this device (offline)
        - Online room
        - How the AI works tab
        - Server / Docker
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Choose vs AI, AI moves first\n2. ..."
  - type: input
    id: env
    attributes:
      label: Browser / OS / Node version
